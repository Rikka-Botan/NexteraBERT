# Phase 2: BERT long-context extension (8192 tokens) — ModernBERT-style brief phase.
# Resumes model weights from Phase 1 (1024) and adapts the RoPE/attention stack
# to the full 8192 target length. 10 B tokens after Phase 1's 120 B (the 13 B /
# 1.3 B models set train_tokens to 1.0e+9 / 1.0e+8).
#
# Data: ~95% text (FineWeb-Edu 90.25% + DCLM 4.75%) + 5% CODE (StarCoderData
# python/java/cpp/javascript), re-packed at 8192 with --pack_mode unpad (fixed
# full-length blocks, document boundaries aligned to 8 tokens so NexteraHRA
# block-pooling never straddles two documents). Built once by
# scripts/build_data.sh to data/mix_8192.bin (+ disjoint eval slice).

# --- training mode ---
training_mode: bert

# --- data (FineWeb-Edu 90.25% + DCLM 4.75% + StarCoderData code 5%, packed at 8192) ---
dataset_name: HuggingFaceFW/fineweb-edu   # unused when 'pretokenized' is set (kept for schema)
dataset_config: sample-350BT
text_column: text
tokenizer: answerdotai/ModernBERT-base
max_seq_len: 8192
pretokenized: data/mix_8192.bin
eval_pretokenized: data/mix_eval_8192.bin  # disjoint held-out blocks, same 90.25/4.75/5 mix

# --- short-context replay (ProLong-style) ---
# Training this phase on ONLY dense 8192 blocks degrades short-sequence PPL: the
# model stops seeing short lengths entirely (so the learnable SSMax scale re-fits
# to the long regime) and the data distribution jumps (packed multi-doc 8192
# blocks vs phase 1's one-doc-per-example). ProLong shows ~40% short data
# is the established fix; ModernBERT/NeoBERT keep short lengths in their
# extension phases for the same reason. 40% of optimizer steps draw varlen
# 1024-token batches (micro-batch auto-sized to 64 = 8 x 8192/1024 for token
# parity) from the shard below.
# Replays the phase-1 TRAIN shard (seen data — normal for replay), keeping
# mix_eval_1024.bin untouched as an uncontaminated held-out 1024 eval set.
short_pretokenized: data/mix_1024.bin
short_ratio: 0.4
# short_batch_size: 64   # default: batch_size * (max_seq_len // short-shard len)

# --- model (identical to phase 1; weights come from the phase-1 checkpoint) ---
disc_size: mezzoforte
# Fixed mask ratio at phase 1's schedule END value (0.4 -> 0.2 over phase 1);
# no mask_ratio_start/end here, so the schedule stays disabled.
mask_ratio: 0.2
router_z_loss_coef: 1.0e-3
load_balance_loss_coef: 1.0e-3

# --- resume from phase 1 ---
resume: checkpoints/mezzoforte_bert/phase1/final.pt
resume_weights_only: true  # fresh optimizer/LR schedule for the new seq length

# --- optimisation ---
# batch_size / grad_accum are PER GPU. The released models were trained on one GPU:
# 8 x 16 = 128 blocks of 8192 tokens per step; on N GPUs divide grad_accum by N to
# keep that batch. These are FIXED, densely unpad-packed 8192-token blocks (no
# padding), and the short-replay steps above draw 64 x 16 one-document 1024-token
# examples instead.
batch_size: 8
grad_accum: 16
lr: 8.0e-5           # long-context extension LR (hand-set; phase 1 peaks at 8e-4)
weight_decay: 0.1    # OptiBERT: fixed 0.1 with standard AdamW (per-step decay lr*wd*p)
beta1: 0.9
beta2: 0.95          # OptiBERT/NeoBERT (LLaMA-2 value)
train_tokens: 1.0e+10   # 10 B content tokens (13 B / 1.3 B models: 1.0e+9 / 1.0e+8)
max_steps: 8000         # fallback only — train_tokens overrides it at startup.
warmup_steps: 400     # a fixed step count (no warmup_frac in this phase), then cosine
                     # decay to 10% of peak LR
grad_clip: 1.0
dtype: bf16
num_workers: 8
compile: true

# --- logging / io ---
output_dir: checkpoints/mezzoforte_bert/phase2
log_every: 20
eval_every: 400
save_every: 2000
eval_steps: 20
seed: 1234

# --- Weights & Biases ---
wandb_project: nexterabert
wandb_log_model: false
