[project]
name = "nexterabert"
version = "0.1.0"
description = "NexteraBERT: model, MLM pretraining and evaluation code for a fast, long-context bidirectional encoder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rikka Botan" }]
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "tokenizers>=0.20",
    "datasets>=2.20",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torchmetrics>=1.4",
    "safetensors>=0.4",
    "huggingface-hub>=0.25",
    "tqdm>=4.66",
    "zstandard>=0.22",
]

[project.optional-dependencies]
eval = [
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "mteb>=1.14",
    # sentence-transformers' trainer (scripts/train_st_dpr.py, the ModernBERT DPR
    # stage) is a Hugging Face Trainer and refuses to start without accelerate
    "accelerate>=1.1.0",
]
train = [
    "wandb>=0.17",
]
dev = [
    "ruff>=0.6",
    # fast tokenizer backend for scripts/prepare_data.py; optional (it falls back
    # to `tokenizers`, and uses gigatoken only after an exact-parity self-test).
    "gigatoken>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexterabert"]

[tool.uv]
# torch is resolved from the default index; for CUDA wheels add e.g.
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
package = true

[tool.ruff]
line-length = 100
target-version = "py310"
